<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D padlock unlock</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body {
    margin:0; background:#0b0c0f; color:#e8e6e1;
    font:400 14px/1.5 ui-monospace,"SF Mono",Menlo,monospace;
    display:grid; place-items:center; gap:16px; align-content:center;
  }
  #stage { width:min(88vw,460px); aspect-ratio:1/1; }
  button {
    background:#20242c; color:#cfd3da; border:1px solid #3a3f4a;
    border-radius:8px; padding:9px 18px; font:inherit; cursor:pointer;
    letter-spacing:.06em;
  }
  button:hover { background:#2a2f38; }
  .hint { color:#6f727a; font-size:12px; }
</style>
</head>
<body>
<div id="stage"></div>
<button id="play">Unlock</button>
<script>
const stage = document.getElementById('stage');
// ---------- scene ----------
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
camera.position.set(0, 0.35, 4.6);  // dead-on, barely above center
camera.lookAt(0, 0, 0);
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
stage.appendChild(renderer.domElement);
function resize() {
  const s = stage.clientWidth;
  renderer.setSize(s, s);
  camera.aspect = 1; camera.updateProjectionMatrix();
}
resize(); addEventListener('resize', resize);
// ---------- lights ----------
const key = new THREE.DirectionalLight(0xffffff, 2.1);
key.position.set(3, 5, 4);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.near = 1; key.shadow.camera.far = 14;
scene.add(key);
const rim = new THREE.DirectionalLight(0x9fc4ff, 0.9);   // cool backlight for metal edges
rim.position.set(-4, 2, -3);
scene.add(rim);
scene.add(new THREE.HemisphereLight(0x9bb0ff, 0x0a0b0e, 0.55));
// ---------- materials ----------
const steel = new THREE.MeshStandardMaterial({ color:0xb2b9c6, metalness:0.95, roughness:0.28 });
const shell = new THREE.MeshStandardMaterial({ color:0x343943, metalness:0.65, roughness:0.42 });
const dark  = new THREE.MeshStandardMaterial({ color:0x0d0f13, metalness:0.2,  roughness:0.9  });
const lock = new THREE.Group();
scene.add(lock);
// ---------- body: rounded-rect shape, extruded with a bevel for soft edges ----------
const W = 1.55, H = 1.3, R = 0.3;
const shape = new THREE.Shape();
shape.moveTo(-W/2 + R, -H/2);
shape.lineTo( W/2 - R, -H/2);
shape.quadraticCurveTo( W/2, -H/2,  W/2, -H/2 + R);
shape.lineTo( W/2,  H/2 - R);
shape.quadraticCurveTo( W/2,  H/2,  W/2 - R,  H/2);
shape.lineTo(-W/2 + R,  H/2);
shape.quadraticCurveTo(-W/2,  H/2, -W/2,  H/2 - R);
shape.lineTo(-W/2, -H/2 + R);
shape.quadraticCurveTo(-W/2, -H/2, -W/2 + R, -H/2);
const bodyGeo = new THREE.ExtrudeGeometry(shape, {
  depth:0.42, bevelEnabled:true, bevelThickness:0.07, bevelSize:0.07, bevelSegments:4, curveSegments:24
});
bodyGeo.center();                                   // ExtrudeGeometry starts at z=0, recenter it
const body = new THREE.Mesh(bodyGeo, shell);
body.position.y = -0.35;
body.castShadow = body.receiveShadow = true;
lock.add(body);
// ---------- keyhole (its own group so it can spin like a tumbler) ----------
const tumbler = new THREE.Group();
tumbler.position.set(0, -0.35, 0.29);
const hole = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.06, 24), dark);
hole.rotation.x = Math.PI / 2;                      // lay the disc flat against the front face
tumbler.add(hole);
const slot = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.3, 0.06), dark);
slot.position.y = -0.17;
tumbler.add(slot);
lock.add(tumbler);
// ---------- shackle: half-torus + two legs ----------
// pivot sits at the RIGHT leg — rotating it on Y swings the shackle out sideways (the 3D payoff)
const pivot = new THREE.Group();
pivot.position.set(0.5, 0, 0);
lock.add(pivot);
const shackle = new THREE.Group();
shackle.position.set(-0.5, 0, 0);                   // undo the pivot offset
pivot.add(shackle);
const arc = new THREE.Mesh(new THREE.TorusGeometry(0.5, 0.115, 20, 48, Math.PI), steel);
arc.position.y = 0.5;
shackle.add(arc);
[-0.5, 0.5].forEach(x => {
  const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.115, 0.115, 0.62, 20), steel);
  leg.position.set(x, 0.2, 0);                      // bottom ends buried ~0.4 inside the body
  shackle.add(leg);
});
shackle.traverse(o => { if (o.isMesh) o.castShadow = true; });
// ---------- floor to catch the shadow ----------
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(12, 12),
  new THREE.ShadowMaterial({ opacity:0.42 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -1.15;
floor.receiveShadow = true;
scene.add(floor);
// ---------- unlock timeline ----------
const tl = gsap.timeline({ paused:true });
tl
  // 1. tumbler turns
  .to(tumbler.rotation, { z:-Math.PI/2, duration:0.42, ease:'power2.inOut' }, 0)
  // 2. body recoils as the bolt releases
  .to(body.position, { y:-0.39, duration:0.07, yoyo:true, repeat:1, ease:'power1.inOut' }, 0.36)
  // 3. shackle pops straight up
  .to(pivot.position, { y:0.4, duration:0.3, ease:'back.out(2.4)' }, 0.42)
  // 4. swings open around the right leg — rotation.y is what makes this read as 3D
  .to(pivot.rotation, { y:-1.9, duration:0.6, ease:'power3.out' }, 0.66)
  // 5. emissive confirmation pulse
  .to(shell.emissive, { r:0.18, g:0.55, b:0.32, duration:0.15 }, 0.7)
  .to(shell.emissive, { r:0, g:0, b:0, duration:0.7, ease:'power2.out' }, 0.9);
document.getElementById('play').addEventListener('click', () => {
  tl.progress() === 1 ? tl.restart() : tl.play();   // replay once it's finished
});
// ---------- loop ----------
(function tick() {
  requestAnimationFrame(tick);
  lock.position.y = Math.sin(performance.now() / 1400) * 0.02;  // faint idle float, no rotation
  renderer.render(scene, camera);
})();
if (matchMedia('(prefers-reduced-motion: reduce)').matches) tl.progress(1);
</script>
</body>
</html>
